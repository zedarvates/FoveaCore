name: FoveaEngine CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  gdscript-lint:
    name: GDScript Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdtoolkit
        run: pip install gdtoolkit
      - name: Lint GDScript files
        run: |
          find addons -name "*.gd" -exec gdlint {} \; 2>&1 | tee lint_output.txt
          if grep -q "error\|Error\|violat" lint_output.txt; then
            echo "Linting errors found."
            cat lint_output.txt
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6
    strategy:
      matrix:
        test-script:
          - res://addons/foveacore/test/test_style_engine.gd
          - res://addons/foveacore/test/test_surface_extractor.gd
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Run Godot headless test
        run: |
          godot --headless --quit-after 100 --script ${{ matrix.test-script }} 2>&1 | tee test_output.txt
          if grep -q "✗\|failed" test_output.txt; then
            echo "Tests failed in ${{ matrix.test-script }}"
            exit 1
          fi

  py-validate:
    name: Python Bridge Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: |
          python -m py_compile addons/foveacore/scripts/reconstruction/worldmirror_bridge.py
          echo "Python bridge syntax OK."

  build-gdextension:
    name: Build GDExtension (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: libfoveacore.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: foveacore.dll
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libfoveacore.dylib
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build Rust crate
        run: |
          cd addons/foveacore/shaders
          cargo build --release --target ${{ matrix.target }}
          
      - name: Locate and upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: foveacore-${{ matrix.target }}
          path: |
            addons/foveacore/shaders/target/${{ matrix.target }}/release/foveacore.dll
            addons/foveacore/shaders/target/${{ matrix.target }}/release/libfoveacore.so
            addons/foveacore/shaders/target/${{ matrix.target }}/release/libfoveacore.dylib
          if-no-files-found: ignore
