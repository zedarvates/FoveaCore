name: FoveaEngine CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.7-dev5"
  GODOT_ZIP: "Godot_v4.7-dev5_mono_linux_x86_64.zip"
  GODOT_BIN: "Godot_v4.7-dev5_mono_linux_x86_64/Godot_v4.7-dev5_mono_linux.x86_64"

jobs:
  # ── 1. Syntaxe GDScript avec le même parseur que le runtime ciblé ──────
  # gdtoolkit 4.5 ne comprend pas encore toute la syntaxe acceptée par
  # Godot 4.7 (notamment certaines formes de chaînes formatées / itération).
  # Godot lui-même est donc l'autorité pour ce hard gate.
  gdscript-parse:
    name: GDScript Parse Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Parse/compile all GDScript files with Godot 4.7
        run: |
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/test_compile_all_scripts.gd

  # ── 2. Syntaxe Python (bridges de reconstruction) ──────────────────────
  py-validate:
    name: Python Bridge Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax (tous les bridges)
        run: |
          python -m py_compile addons/foveacore/scripts/reconstruction/*.py
          echo "Python bridges syntax OK."

  # ── 3. Build C# (Godot.NET.Sdk) ─────────────────────────────────────────
  dotnet-build:
    name: C# Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build FoveaEngine.csproj
        run: dotnet build FoveaEngine.csproj --nologo

  # ── 4. Vérification de compilation Godot headless (échec dur) ──────────
  godot-compile-check:
    name: Godot Compile Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          "./${GODOT_BIN}" --headless --path . --import || true
      - name: Compile-check all scripts
        run: |
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/test_compile_all_scripts.gd

  # ── 5a. Tests unitaires non-GPU (échec dur) ────────────────────────────
  unit-tests-nogpu:
    name: Unit Tests (non-GPU, hard fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          "./${GODOT_BIN}" --headless --path . --import || true
      - name: Run non-GPU tests (hard fail)
        run: |
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/run_all_tests.gd --group=nogpu

  # ── 5b. Tests unitaires GPU (informatif sur runner sans GPU) ───────────
  unit-tests-gpu:
    name: Unit Tests (GPU, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          "./${GODOT_BIN}" --headless --path . --import || true
      - name: Run GPU tests (informational)
        run: |
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/run_all_tests.gd --group=gpu

  # ── 5c. Matrice de non-crash au démarrage (échec dur) ──────────────────
  # Le plugin déclare une GDExtension native. Construire et déposer le binaire
  # Linux attendu avant l'import évite de transformer une absence d'artefact CI
  # en faux crash applicatif.
  smoke-startup:
    name: Smoke Startup (no-crash, hard fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rendering-method: [forward_plus, mobile, gl_compatibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build and stage Linux GDExtension
        run: |
          cargo build --manifest-path addons/foveacore/rust/Cargo.toml \
            --release --target x86_64-unknown-linux-gnu
          mkdir -p addons/foveacore/gdextension/bin
          cp addons/foveacore/rust/target/x86_64-unknown-linux-gnu/release/libfoveacore.so \
            addons/foveacore/gdextension/bin/libfoveacore.so
          test -s addons/foveacore/gdextension/bin/libfoveacore.so
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          "./${GODOT_BIN}" --headless --path . --import || true
      - name: Smoke boot (${{ matrix.rendering-method }}), fail on ERROR
        run: |
          set -o pipefail
          "./${GODOT_BIN}" --headless --rendering-method ${{ matrix.rendering-method }} \
            --path . -s res://addons/foveacore/test/smoke_startup.gd 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|ERROR:" smoke.log; then
            echo "::error::Startup emitted ERROR lines under ${{ matrix.rendering-method }}"
            exit 1
          fi

  # ── 5d. Régression visuelle (lavapipe + Xvfb, informatif/bootstrap) ────
  visual-regression:
    name: Visual Regression (lavapipe, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install software Vulkan (lavapipe), Xvfb, ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb imagemagick
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          xvfb-run -a "./${GODOT_BIN}" --headless --path . --import || true
      - name: Capture render (Vulkan / lavapipe under Xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 800x600x24" \
            "./${GODOT_BIN}" --rendering-driver vulkan --resolution 800x600 \
            --path . -s res://addons/foveacore/test/capture_render.gd -- --out=capture.png
          ls -l capture.png
      - name: Compare to golden (or bootstrap baseline)
        run: |
          GOLDEN=test/fixtures/golden_render.png
          if [ -f "$GOLDEN" ]; then
            RMSE=$(compare -metric RMSE "$GOLDEN" capture.png diff.png 2>&1 | sed -E 's/.*\(([0-9.]+)\).*/\1/' || echo "1")
            echo "RMSE=$RMSE (threshold 0.05)"
            awk -v r="$RMSE" 'BEGIN { exit (r+0 > 0.05) }' \
              || { echo "::error::Visual regression: RMSE $RMSE exceeds 0.05"; exit 1; }
          else
            echo "::warning::No golden yet — publishing capture.png as the baseline to commit at test/fixtures/golden_render.png"
          fi
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-baseline
          path: |
            capture.png
            diff.png
          if-no-files-found: ignore

  # ── 6. Build GDExtension Rust ───────────────────────────────────────────
  build-gdextension:
    name: Build GDExtension (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: libfoveacore.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: foveacore.dll
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libfoveacore.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libfoveacore.dylib
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Rust crate
        run: |
          cd addons/foveacore/rust
          cargo build --release --target ${{ matrix.target }}
      - name: Locate and upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: foveacore-${{ matrix.target }}
          path: |
            addons/foveacore/rust/target/${{ matrix.target }}/release/foveacore.dll
            addons/foveacore/rust/target/${{ matrix.target }}/release/libfoveacore.so
            addons/foveacore/rust/target/${{ matrix.target }}/release/libfoveacore.dylib
          if-no-files-found: ignore
