name: FoveaEngine CI

on:
  push:
    branches: [main, feat/*, autoresearch/**]
  pull_request:
    branches: [main, autoresearch/**]

env:
  GODOT_VERSION: "4.7-dev5"
  GODOT_ZIP: "Godot_v4.7-dev5_mono_linux_x86_64.zip"
  GODOT_BIN: "Godot_v4.7-dev5_mono_linux_x86_64/Godot_v4.7-dev5_mono_linux.x86_64"

jobs:
  # ── 1. Syntaxe GDScript (rapide, échec dur) ─────────────────────────────
  gdscript-parse:
    name: GDScript Parse Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdtoolkit (Godot 4)
        run: pip install "gdtoolkit==4.*"
      - name: Parse all GDScript files (hors godot-cpp)
        run: |
          find addons test -name "*.gd" -not -path "*godot-cpp*" -print0 \
            | xargs -0 gdparse
          echo "GDScript parse OK."

  # ── 2. Syntaxe Python (bridges de reconstruction) ──────────────────────
  py-validate:
    name: Python and Public Docs Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Validate Python tools and public docs
        run: |
          python -m compileall -q addons tools test
          python tools/test_bake_offset_field.py -v
          python tools/test_file_digest.py -v
          python addons/tools/test_validation_tools.py
          python tools/check_public_docs.py
          echo "Python tools and public docs OK."

  # ── 3. Build C# (Godot.NET.Sdk) ─────────────────────────────────────────
  dotnet-build:
    name: C# Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install deterministic image test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Build FoveaEngine.csproj
        run: dotnet build FoveaEngine.csproj --configuration Release --nologo
      - name: Test C# Morton encoder
        run: dotnet test tests/FoveaEngine.Tests/FoveaEngine.Tests.csproj --configuration Release --nologo

  # ── 4. Vérification de compilation Godot headless (échec dur) ──────────
  godot-compile-check:
    name: Godot Compile Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install deterministic image test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          # This job validates the documented GDScript-only fallback. A clean
          # checkout must not try to load a native library that this job does
          # not build. Move the manifest out of Godot's scan path and clear
          # any import cache before starting the editor.
          mv addons/foveacore/foveacore.gdextension \
            addons/foveacore/foveacore.gdextension.ci-disabled
          sed -i 's/^enabled=PackedStringArray.*/enabled=PackedStringArray()/' project.godot
          rm -rf .godot
          "./${GODOT_BIN}" --headless --path . --import
      - name: Compile-check all scripts
        run: |
          set -o pipefail
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/test_compile_all_scripts.gd 2>&1 \
            | tee compile-check.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" compile-check.log; then
            echo "::error::Godot emitted compile/load errors that the in-process loader could not count."
            exit 1
          fi
      - name: Build C# scripts for the Godot runtime
        run: dotnet build FoveaEngine.csproj --configuration Debug --nologo
      - name: Run C# Gaussian Splat runtime suite
        run: |
          set -o pipefail
          "./${GODOT_BIN}" --headless --xr-mode off --path . \
            --scene res://test/test_fovea_splat.tscn 2>&1 | tee csharp-runtime.log
          if ! grep -F "=== ALL GAUSSIAN SPLAT SUITE TESTS PASSED ===" csharp-runtime.log; then
            echo "::error::The C# Gaussian Splat runtime suite did not report success."
            exit 1
          fi
          if grep -E "Test Run CRASHED|GAUSSIAN SPLAT SUITE TESTS FAILED|SCRIPT ERROR|Parse Error" csharp-runtime.log; then
            echo "::error::The C# Gaussian Splat runtime suite emitted a fatal diagnostic."
            exit 1
          fi

  # ── 5a. Tests unitaires non-GPU (échec dur) ────────────────────────────
  # Valident la logique pure (parsing, .fovea, math, cleaner...) sans
  # RenderingDevice. Doivent toujours passer headless → échec dur (C1).
  unit-tests-nogpu:
    name: Unit Tests (non-GPU, hard fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install non-GPU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          python3 -m pip install --user pillow
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          mv addons/foveacore/foveacore.gdextension \
            addons/foveacore/foveacore.gdextension.ci-disabled
          sed -i 's/^enabled=PackedStringArray.*/enabled=PackedStringArray()/' project.godot
          rm -rf .godot
          "./${GODOT_BIN}" --headless --path . --import
      - name: Run non-GPU tests (hard fail)
        run: |
          set -o pipefail
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/run_all_tests.gd -- --group=nogpu 2>&1 \
            | tee nogpu-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" nogpu-tests.log; then
            echo "::error::Godot emitted semantic script errors during the non-GPU suite."
            exit 1
          fi
      - name: Run ComfyUI splat loopback contract
        run: python3 tools/test_comfyui_splat_http.py --godot "./${GODOT_BIN}"

  # ── 5b. Tests unitaires GPU (informatif sur runner sans GPU) ───────────
  # Les suites marquées `const REQUIRES_GPU := true` ne valident vraiment
  # qu'avec un vrai GPU. Sur les runners GitHub (logiciel/headless) elles
  # dégradent en faux-positif → job informatif. À promouvoir en échec dur
  # sur un runner self-hosted avec GPU (C6).
  unit-tests-gpu:
    name: Unit Tests (GPU, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          mv addons/foveacore/foveacore.gdextension \
            addons/foveacore/foveacore.gdextension.ci-disabled
          sed -i 's/^enabled=PackedStringArray.*/enabled=PackedStringArray()/' project.godot
          rm -rf .godot
          "./${GODOT_BIN}" --headless --path . --import
      - name: Run GPU tests (informational)
        run: |
          "./${GODOT_BIN}" --headless --path . \
            -s res://addons/foveacore/test/run_all_tests.gd -- --group=gpu \
            || echo "::warning::GPU suites require a real GPU runner; result is informational."

  # ── 5c. Matrice de non-crash au démarrage (échec dur) ──────────────────
  # Le plugin doit démarrer et charger un nuage de splats proprement dans
  # chaque méthode de rendu ET en mode GDScript-only (pas de binaire natif :
  # rien n'est compilé dans ce job). Échec si exit != 0 ou si une ligne
  # "SCRIPT ERROR" / "ERROR:" apparaît à la sortie. (C5)
  smoke-startup:
    name: Smoke Startup (no-crash, hard fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rendering-method: [forward_plus, mobile, gl_compatibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          mv addons/foveacore/foveacore.gdextension \
            addons/foveacore/foveacore.gdextension.ci-disabled
          sed -i 's/^enabled=PackedStringArray.*/enabled=PackedStringArray()/' project.godot
          rm -rf .godot
          "./${GODOT_BIN}" --headless --path . --import
      - name: Smoke boot (${{ matrix.rendering-method }}), fail on ERROR
        run: |
          set -o pipefail
          "./${GODOT_BIN}" --headless --rendering-method ${{ matrix.rendering-method }} \
            --path . -s res://addons/foveacore/test/smoke_startup.gd 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|ERROR:" smoke.log; then
            echo "::error::Startup emitted ERROR lines under ${{ matrix.rendering-method }}"
            exit 1
          fi

  # ── 5d. Régression visuelle (lavapipe + Xvfb, informatif/bootstrap) ────
  # Rend la scène de démo avec Mesa lavapipe (Vulkan logiciel) sous Xvfb et
  # compare le PNG au golden `test/fixtures/golden_render.png` (RMSE perceptuel).
  # Bootstrap : si le golden n'existe pas encore, le rendu est publié en
  # artefact `render-baseline` à committer. Informatif (continue-on-error) tant
  # que le golden n'est pas figé et le seuil calibré → passer en échec dur
  # ensuite. (C4)
  visual-regression:
    name: Visual Regression (lavapipe, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install software Vulkan (lavapipe), Xvfb, ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb imagemagick
      - name: Download Godot ${{ env.GODOT_VERSION }} (mono)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
      - name: Import project resources
        run: |
          mv addons/foveacore/foveacore.gdextension \
            addons/foveacore/foveacore.gdextension.ci-disabled
          sed -i 's/^enabled=PackedStringArray.*/enabled=PackedStringArray()/' project.godot
          rm -rf .godot
          xvfb-run -a "./${GODOT_BIN}" --headless --path . --import
      - name: Capture render (Vulkan / lavapipe under Xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          timeout 120s xvfb-run -a -s "-screen 0 800x600x24" \
            "./${GODOT_BIN}" --rendering-driver vulkan --resolution 800x600 \
            --path . -s res://addons/foveacore/test/capture_render.gd -- --out=capture.png \
            || true
          if [ -f capture.png ]; then
            ls -l capture.png
          else
            echo "::warning::Visual capture timed out or produced no image."
          fi
      - name: Compare to golden (or bootstrap baseline)
        run: |
          GOLDEN=test/fixtures/golden_render.png
          if [ -f "$GOLDEN" ]; then
            # Normalized RMSE in [0,1]; tolerate minor lavapipe noise.
            RMSE=$(compare -metric RMSE "$GOLDEN" capture.png diff.png 2>&1 | sed -E 's/.*\(([0-9.]+)\).*/\1/' || echo "1")
            echo "RMSE=$RMSE (threshold 0.05)"
            awk -v r="$RMSE" 'BEGIN { exit (r+0 > 0.05) }' \
              || { echo "::error::Visual regression: RMSE $RMSE exceeds 0.05"; exit 1; }
          else
            echo "::warning::No golden yet — publishing capture.png as the baseline to commit at test/fixtures/golden_render.png"
          fi
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-baseline
          path: |
            capture.png
            diff.png
          if-no-files-found: ignore

  # ── 6. Build GDExtension Rust ───────────────────────────────────────────
  build-rust-gdextension:
    name: Build Rust GDExtension
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: libfoveacore.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: foveacore.dll
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libfoveacore.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libfoveacore.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust crate
        run: |
          cd addons/foveacore/rust
          cargo build --release --target ${{ matrix.target }}

      - name: Test Rust crate
        run: |
          cd addons/foveacore/rust
          cargo test --release --target ${{ matrix.target }}

      - name: Locate and upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: foveacore-${{ matrix.target }}
          path: |
            addons/foveacore/rust/target/${{ matrix.target }}/release/foveacore.dll
            addons/foveacore/rust/target/${{ matrix.target }}/release/libfoveacore.so
            addons/foveacore/rust/target/${{ matrix.target }}/release/libfoveacore.dylib
          if-no-files-found: error

  rust-quality:
    name: Rust Unit Tests and Lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test and lint both Rust crates
        run: |
          for crate in addons/foveacore/rust addons/foveacore/rust/splat_sorter; do
            cargo test --manifest-path "$crate/Cargo.toml" --all-targets
            # godot-rust's #[godot_api] macro expands to a generated callback
            # whose CallError is intentionally large. Keep warnings fatal while
            # excluding that third-party generated code diagnostic.
            cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings -A clippy::result_large_err
          done

  build-cpp-gdextension:
    name: Build C++ GDExtension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCons
        run: pip install scons
      - name: Build godot-cpp bindings
        working-directory: addons/foveacore/gdextension/godot-cpp
        run: scons platform=windows target=template_release arch=x86_64
      - name: Build C++ extension
        working-directory: addons/foveacore/gdextension
        run: scons platform=windows target=template_release arch=x86_64
      - name: Download Godot Mono for C++ runtime smoke
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7-dev5/Godot_v4.7-dev5_mono_win64.zip" `
            -OutFile godot-cpp-smoke.zip
          Expand-Archive -LiteralPath godot-cpp-smoke.zip -DestinationPath godot-cpp-smoke
          $godot = Get-ChildItem -Path godot-cpp-smoke -Filter '*_console.exe' -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godot) { throw 'Godot Mono console executable was not found in the archive.' }
          "GODOT_CPP_SMOKE_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke-test C++ extension load
        shell: pwsh
        run: |
          & $env:GODOT_CPP_SMOKE_BIN --headless --xr-mode off --path . `
            -s res://addons/foveacore/gdextension/test_cpp_extension_load.gd
          if ($LASTEXITCODE -ne 0) { throw "C++ extension smoke failed with exit code $LASTEXITCODE." }
      - name: Verify C++ extension fails closed when the binary is unavailable
        shell: pwsh
        run: |
          $control = Start-Process -FilePath $env:GODOT_CPP_SMOKE_BIN `
            -ArgumentList @(
              '--headless', '--xr-mode', 'off', '--path', '.',
              '-s', 'res://addons/foveacore/gdextension/test_cpp_extension_load.gd',
              '--', '--force-missing-binary'
            ) -Wait -PassThru -NoNewWindow
          if ($control.ExitCode -ne 1) { throw "C++ missing-binary control exited with $($control.ExitCode) instead of 1." }
      - name: Upload C++ extension
        uses: actions/upload-artifact@v4
        with:
          name: foveacore-cpp-windows-x86_64
          path: addons/foveacore/gdextension/bin/foveacore_cpp.dll
          if-no-files-found: error
